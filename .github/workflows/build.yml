name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK with Gradle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Find Project Directory
        id: find-dir
        run: |
          # Mencari folder yang memiliki file build.gradle secara otomatis
          GRADLE_FILE=$(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT
          echo "Folder proyek ditemukan di: $PROJECT_DIR"

      - name: Grant execute permission for gradlew
        run: |
          find . -name "gradlew" -exec chmod +x {} \;

      - name: Build APK with Gradle Wrapper
        working-directory: ${{ steps.find-dir.outputs.project_dir }}
        run: |
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/**/*.apk
