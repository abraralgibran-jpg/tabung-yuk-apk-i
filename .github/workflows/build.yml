name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK Tabung Yuk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          GRADLE_ROOT=$(find . -maxdepth 5 \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1)
          if [ -z "$GRADLE_ROOT" ]; then
            echo "ERROR: File settings.gradle tidak ditemukan di repositori!"
            find . -maxdepth 4
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLE_ROOT")
          echo "Proyek Gradle ditemukan di: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug

          mkdir -p "$GITHUB_WORKSPACE/output-apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/output-apk/tabung-yuk.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tabung-yuk-apk
          path: output-apk/tabung-yuk.apk
